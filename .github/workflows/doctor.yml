name: doctor

# The framework repository holds no product code. What CI protects here is that
# the workspace stays portable, stays free of any single organisation's material,
# and that the ws CLI keeps its promises — it writes hooks into client repos and
# runs rm -rf over skill directories, so a regression damages real repositories.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ws test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The suite skips its search check when ripgrep is absent, and that check
      # guards the .ignore rule that keeps product code visible to agents.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Run tests
        run: ./test/ws.test.sh

      - name: Run Python tests
        run: |
          python3 test/ws-web.test.py
          python3 test/ws-tasks.test.py
          python3 test/ws-security.test.py

  doctor:
    name: workspace hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # workspace.conf is untracked by design: it is the only file that names an
      # organisation. CI uses the shipped example so `ws doctor` has an identity.
      - name: Provide a throwaway identity
        run: cp workspace.conf.example workspace.conf

      - name: ws doctor --ci
        run: bash .agents/bin/ws doctor --ci
